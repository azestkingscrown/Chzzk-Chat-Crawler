name: Build & Release

on:
  push:
    tags:
      - 'v*'   # v1.0.0, v1.2.3 등 태그 push 시 자동 실행

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # GitHub Release 생성/업로드 권한

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 전체 플랫폼 빌드
        run: npm run build

      - name: 빌드 결과물 확인
        run: ls -lh dist/

      - name: GitHub Release 생성 및 바이너리 업로드
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## 치지직 실시간 채팅 수집기 ${{ github.ref_name }}

            운영체제와 아키텍처에 맞는 파일을 다운로드하세요.

            | 운영체제 | 아키텍처 | 파일명 |
            |---------|---------|--------|
            | Windows | x64 (일반 PC) | `chzzk-chat-collector-win-x64.exe` |
            | Windows | ARM64 | `chzzk-chat-collector-win-arm64.exe` |
            | Linux | x64 | `chzzk-chat-collector-linux-x64` |
            | Linux | ARM64 | `chzzk-chat-collector-linux-arm64` |
            | macOS | Intel | `chzzk-chat-collector-macos-x64` |
            | macOS | Apple Silicon (M1/M2/M3) | `chzzk-chat-collector-macos-arm64` |

            > **Windows**: SmartScreen 경고 시 [추가 정보] → [실행] 클릭
            > **Linux/macOS**: `chmod +x ./파일명` 후 실행
          files: |
            dist/chzzk-chat-collector-win-x64.exe
            dist/chzzk-chat-collector-win-arm64.exe
            dist/chzzk-chat-collector-linux-x64
            dist/chzzk-chat-collector-linux-arm64
            dist/chzzk-chat-collector-macos-x64
            dist/chzzk-chat-collector-macos-arm64
          draft: false
          prerelease: false
